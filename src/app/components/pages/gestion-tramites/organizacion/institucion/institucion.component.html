<div class="p-4 h-[calc(100vh-150px)] flex flex-col">

  <div class="mb-4">
    <h2 class="text-2xl font-bold">Administración de Instituciones</h2>
  </div>

  <div class="mb-4 flex items-center justify-between gap-4">
  <form class="flex min-w-0 max-w-3xl flex-1 items-center gap-2" (ngSubmit)="buscar()">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="min-w-0 flex-1">
      <mat-label>Buscar institución</mat-label>
      <input matInput name="busqueda" [(ngModel)]="busqueda" (ngModelChange)="buscarAlEscribir($event)" placeholder="Nombre o sigla">
      @if (busqueda) {
        <button matSuffix mat-icon-button type="button" aria-label="Limpiar búsqueda" (click)="limpiarBusqueda()"><mat-icon>close</mat-icon></button>
      }
    </mat-form-field>
    <button mat-mini-fab color="primary" type="submit" aria-label="Buscar institución"><mat-icon>search</mat-icon></button>
  </form>
    @if (puedeCrear) {
      <button mat-mini-fab color="primary" type="button" aria-label="Agregar institución" title="Agregar institución" (click)="agregarInstitucion()"><mat-icon>add</mat-icon></button>
    }
  </div>

  <div class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-lg border border-gray-300 bg-white">
    <div class="min-h-0 flex-1 overflow-auto">

    <table mat-table [dataSource]="instituciones" class="w-full mat-elevation-z2">

      <ng-container matColumnDef="nro">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 py-2 px-4 text-left font-bold text-gray-600">
          Nro
        </th>

        <td mat-cell *matCellDef="let institucion; let i = index" class="py-2 px-4 border-t">
          {{ pageIndex * pageSize + i + 1 }}
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 py-2 px-4 text-left font-bold text-gray-600">
          Nombre
        </th>

        <td mat-cell *matCellDef="let institucion" class="py-2 px-4 border-t">
          {{ institucion.nombre }}
        </td>
      </ng-container>

      <ng-container matColumnDef="sigla">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 py-2 px-4 text-left font-bold text-gray-600">
          Sigla
        </th>

        <td mat-cell *matCellDef="let institucion" class="py-2 px-4 border-t">
          {{ institucion.sigla }}
        </td>
      </ng-container>

      <ng-container matColumnDef="opciones">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 py-2 px-4 text-center font-bold text-gray-600">
          Opciones
        </th>

        <td mat-cell *matCellDef="let institucion" class="py-2 px-4 border-t text-center">

          <button mat-icon-button color="primary" (click)="editarInstitucion(institucion)">
            <mat-icon>edit</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"
        class="hover:bg-gray-50 transition-colors">
      </tr>

    </table>

    </div>

    <mat-paginator
      class="shrink-0 border-t border-gray-200 bg-white"
      [length]="totalRegistros"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="cambiarPagina($event)"
    ></mat-paginator>
  </div>

</div>
