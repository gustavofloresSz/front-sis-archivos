<h2 mat-dialog-title class="flex items-center gap-2">
  <mat-icon>{{ esEdicion ? 'edit' : 'add_circle' }}</mat-icon>
  {{ esEdicion ? 'Editar clasificación' : 'Agregar clasificación' }}
</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="flex min-w-[360px] flex-col gap-3 pt-2">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="150" />
      <mat-error *ngIf="form.controls.nombre.hasError('required')">
        El nombre es obligatorio.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado">
        <mat-option [value]="true">Activo</mat-option>
        <mat-option [value]="false">Inactivo</mat-option>
      </mat-select>
    </mat-form-field>

    @if (errorMensaje) {
      <p class="m-0 text-sm text-red-600">{{ errorMensaje }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="gap-2 px-6 pb-4">
    <button mat-button type="button" (click)="cancelar()" [disabled]="guardando">
      Cancelar
    </button>
    <button mat-flat-button color="primary" type="submit" [disabled]="guardando">
      <mat-icon>{{ guardando ? 'hourglass_empty' : 'save' }}</mat-icon>
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</form>
