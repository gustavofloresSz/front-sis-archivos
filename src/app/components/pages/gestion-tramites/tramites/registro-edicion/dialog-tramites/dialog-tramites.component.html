<div mat-dialog-title class="tramite-dialog-title">
  <h2 class="m-0">
    {{ esEdicion ? 'Editar Trámite' : 'Registrar Trámite' }}
  </h2>
</div>

<form class="tramite-dialog-form" [formGroup]="tramiteForm" (ngSubmit)="guardarTramite(stepper)">
  <mat-dialog-content class="tramite-dialog-content">
    @if (errorMensaje) {
      <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        {{ errorMensaje }}
      </div>
    }

    <mat-horizontal-stepper [linear]="!esEdicion" #stepper class="compact-stepper w-full">

      <mat-step [stepControl]="datosGeneralesForm" label="Datos del trámite">
        <app-datos-tramite-step
          [form]="datosGeneralesForm"
          [esEdicion]="esEdicion"
          [gestiones]="gestiones">
        </app-datos-tramite-step>
      </mat-step>

      <mat-step [stepControl]="clasificacionForm" label="Clasificación">
        <app-clasificacion-step
          [form]="clasificacionForm"
          [tiposTramite]="tiposTramite"
          [clasificacionesTramite]="clasificacionesTramite"
          [estadosTramite]="estadosTramite"
          [esUrbanizacion]="esUrbanizacion"
          [esEdicion]="esEdicion">
        </app-clasificacion-step>
      </mat-step>

      <mat-step [stepControl]="superficiesForm" label="Superficies">
        <app-superficies-step
          [form]="superficiesForm">
        </app-superficies-step>
      </mat-step>

      <mat-step [stepControl]="archivoUbicacionForm" label="Archivo y ubicación física">
        <app-archivo-ubicacion-step
          [form]="archivoUbicacionForm"
          [ambientesFisicos]="ambientesFisicos"
          [estantesFisicos]="estantesFisicos"
          [ubicacionesFisicas]="ubicacionesFisicas"
          [esEdicion]="esEdicion"
          [ubicacionInicialId]="tramiteEditando?.ubicacion_fisica_id ?? tramiteEditando?.ubicacion_fisica?.id ?? null"
          [archivosExistentes]="archivosExistentes"
          (archivosSeleccionadosChange)="actualizarArchivosSeleccionados($event)"
          (archivosRetiradosChange)="actualizarArchivosRetirados($event)"
          (ubicacionPendienteChange)="actualizarUbicacionPendiente($event)">
        </app-archivo-ubicacion-step>
      </mat-step>

      <mat-step [stepControl]="comprobantePagoForm" label="Comprobante de pago">
        <app-comprobante-pago-step
          [form]="comprobantePagoForm">
        </app-comprobante-pago-step>
      </mat-step>

      <mat-step label="Confirmación">
        <app-confirmacion-step
          [datosGeneralesForm]="datosGeneralesForm"
          [clasificacionForm]="clasificacionForm"
          [superficiesForm]="superficiesForm"
          [archivoUbicacionForm]="archivoUbicacionForm"
          [comprobantePagoForm]="comprobantePagoForm"
          [tiposTramite]="tiposTramite"
          [clasificacionesTramite]="clasificacionesTramite"
          [estadosTramite]="estadosTramite"
          [ubicacionesFisicas]="ubicacionesFisicas"
          [archivosSeleccionados]="archivosSeleccionados"
          [archivosExistentes]="archivosExistentes"
          [archivosRetiradosIds]="archivosRetiradosIds"
          [esUrbanizacion]="esUrbanizacion"
          [esEdicion]="esEdicion">
        </app-confirmacion-step>
      </mat-step>

    </mat-horizontal-stepper>
  </mat-dialog-content>

  <mat-dialog-actions class="tramite-dialog-actions">
    @if (stepper.selectedIndex > 0) {
      <button mat-button type="button" (click)="stepper.previous()" class="app-button-secondary">Atrás</button>
    }
    <button mat-button type="button" (click)="cancelar()" class="app-button-secondary">Cancelar</button>
    @if (stepper.selectedIndex === stepper.steps.length - 1) {
      <button mat-flat-button color="primary" type="submit" [disabled]="guardando" class="app-button-primary">
        {{ guardando ? 'Guardando...' : esEdicion ? 'Actualizar trámite' : 'Registrar trámite' }}
      </button>
    } @else {
      <button mat-flat-button color="primary" type="button" (click)="avanzar(stepper, stepper.selected?.stepControl ?? tramiteForm)" class="app-button-primary">Siguiente</button>
    }
  </mat-dialog-actions>
</form>
